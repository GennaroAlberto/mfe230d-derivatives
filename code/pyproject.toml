[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfe230d"
version = "0.1.0"
description = "Code illustrations for MFE 230D: Derivatives: Quantitative Methods"
authors = [{ name = "Alberto Gennaro" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "ipywidgets>=8"]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
